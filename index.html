.sec[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

.cols{display:grid;gap:32px}

    y += 34*k;

      br.position.copy(onFace(s.face, HW, u, st.y+7.6, 0.3)); br.quaternion.copy(f.q); scene.add(br);
    }
  }
}

// ---------- camera: always square to the wall, centered ----------
const tanH = Math.tan(THREE.MathUtils.degToRad(FOV/2));
function viewFor(s, i){
  const st = s.stops[i], f = FACES[s.face];
  let target, w, h, fh;
  if (st.kind==='billboard'){ target = new V3(0, R+17, BB.z); w=24; h=22; fh=.96; }
  else { target = onFace(s.face, HW, 0, st.y, 0.8); w=12.4; h=14.8; fh=.9; }
  const d = Math.max((h/fh)/(2*tanH), (w/.96)/(2*tanH*camera.aspect));
  return { pos: target.clone().add(f.n.clone().multiplyScalar(d)), target };
}
const toCyl = v => ({ a:Math.atan2(v.x, v.z), r:Math.hypot(v.x, v.z), y:v.y });
const fromCyl = c => new V3(Math.sin(c.a)*c.r, c.y, Math.cos(c.a)*c.r);
const angD = (a,b) => { let d=(b-a)%(2*Math.PI); if (d>Math.PI) d-=2*Math.PI; if (d<-Math.PI) d+=2*Math.PI; return d; };
const lerpC = (a,b,k) => ({ a:a.a+(b.a-a.a)*k, r:a.r+(b.r-a.r)*k, y:a.y+(b.y-a.y)*k });
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
let cur = null, anim = null, curSec = SECTIONS[curIdx], curStop = stopIdx;
function setView(s, i, instant){
  curSec = s; curStop = i;
  const v = viewFor(s, i), to = { cam:toCyl(v.pos), tgt:toCyl(v.target) };
  if (instant || !cur || reduce){ cur = to; anim = null; return; }
  const from = { cam:{...cur.cam}, tgt:{...cur.tgt} };
  to.cam.a = from.cam.a + angD(from.cam.a, to.cam.a);
  to.tgt.a = from.tgt.a + angD(from.tgt.a, to.tgt.a);
  const da = Math.abs(to.cam.a - from.cam.a), dy = Math.abs(to.cam.y - from.cam.y);
  anim = { from, to, t0:performance.now(), dur: 900 + da/Math.PI*1100 + Math.min(700, dy*12), bump: da>0.2 ? 9 : Math.min(7, dy*.12) };
}

// ---------- weather ----------
const L = 24;
const dotTex = (() => { const c=mkCanvas(64,64), g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.45,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return tex(c); })();
function snowLayer(n, size, speed){
  const pos = new Float32Array(n*3), ph = new Float32Array(n);
  for (let i=0;i<n;i++){ pos[i*3]=(Math.random()*2-1)*L; pos[i*3+1]=60+(Math.random()*2-1)*L; pos[i*3+2]=(Math.random()*2-1)*L+30; ph[i]=Math.random()*6.28; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size, map:dotTex, transparent:true, depthWrite:false, color:0xffffff, opacity:.95, fog:false }));
  pts.frustumCulled = false; scene.add(pts);
  return { pts, pos, ph, n, speed };
}
const snow = [snowLayer(1600, 0.2, 2.2), snowLayer(420, 0.42, 3.0)];
const RN = 900, rpos = new Float32Array(RN*6), rhead = new Float32Array(RN*3);
for (let i=0;i<RN;i++){ rhead[i*3]=(Math.random()*2-1)*L; rhead[i*3+1]=60+(Math.random()*2-1)*L; rhead[i*3+2]=(Math.random()*2-1)*L+30; }
const rgeo = new THREE.BufferGeometry(); rgeo.setAttribute('position', new THREE.BufferAttribute(rpos,3));
const rain = new THREE.LineSegments(rgeo, new THREE.LineBasicMaterial({ color:0xdfe6e4, transparent:true, opacity:.55, depthWrite:false, fog:false }));
rain.frustumCulled = false; scene.add(rain);
const wrapV = (v,c) => { let r=v-c; r=((r+L)%(2*L)+2*L)%(2*L)-L; return c+r; };
const RV = new V3(-3, -38, -1.5);

function setWeather(w){
  snow.forEach(s => s.pts.visible = w==='snow'); rain.visible = w==='rain';
  scene.fog.color.set(HAZE[w]);
  const cloudCol = { snow:0xf7e4e2, rain:0x9faab8, sun:0xffe2d6 }[w], cloudOp = { snow:.5, rain:.65, sun:.42 }[w];
  clouds.forEach(c => c.children.forEach(s => { s.material.color.set(cloudCol); s.material.opacity = cloudOp; }));
  sunSprite.visible = sunGlow.visible = w !== 'rain';
  sunSprite.material.opacity = w==='sun' ? 1 : .45; sunGlow.material.opacity = w==='sun' ? .7 : .25;
  if (w==='snow'){ hemi.intensity=.78; hemi.color.set(0xf6ecee); sunL.intensity=.5; sunL.color.set(0xf6ecee); }
  if (w==='rain'){ hemi.intensity=.62; hemi.color.set(0xd6dce8); sunL.intensity=.26; sunL.color.set(0xd6dce8); }
  if (w==='sun'){ hemi.intensity=.62; hemi.color.set(0xffe6e6); sunL.intensity=1.05; sunL.color.set(0xffc49a); }
}
function updateWeather(dt, t, c){
  if (weather==='snow') for (const s of snow){
    for (let i=0;i<s.n;i++){
      const j=i*3;
      s.pos[j]   = wrapV(s.pos[j]   + Math.sin(t*.8+s.ph[i])*.6*dt, c.x);
      s.pos[j+1] = wrapV(s.pos[j+1] - s.speed*dt, c.y);
      s.pos[j+2] = wrapV(s.pos[j+2] + Math.cos(t*.6+s.ph[i])*.4*dt, c.z);
    }
    s.pts.geometry.attributes.position.needsUpdate = true;
  }
  if (weather==='rain'){
    for (let i=0;i<RN;i++){
      const j=i*3;
      rhead[j]=wrapV(rhead[j]+RV.x*dt, c.x); rhead[j+1]=wrapV(rhead[j+1]+RV.y*dt, c.y); rhead[j+2]=wrapV(rhead[j+2]+RV.z*dt, c.z);
      const k=i*6; rpos[k]=rhead[j]; rpos[k+1]=rhead[j+1]; rpos[k+2]=rhead[j+2];
      rpos[k+3]=rhead[j]-RV.x*.032; rpos[k+4]=rhead[j+1]-RV.y*.032; rpos[k+5]=rhead[j+2]-RV.z*.032;
    }
    rgeo.attributes.position.needsUpdate = true;
  }
  for (const cl of clouds) cl.userData.a += dt*0.004;
  placeClouds();
}

// ---------- size & loop ----------
function resize(){
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  if (!anim) setView(curSec, curStop, true);
}
new ResizeObserver(resize).observe(sceneEl);

// ---------- swallows: a small formation dives behind the billboard, leaving contrails ----------
const SW_FRAMES = 8, SW_ASPECT = 32/33, TR = 120, TRAIL_LIFE = 1.9;
const swImg = new Image(), swTex = new THREE.Texture(swImg);
swImg.onload = () => { swTex.needsUpdate = true; };
swImg.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAAhCAYAAAA29XVBAAACUUlEQVR42u2d0Y0DIQxEw2k7SBOpJQVfLdfE1ZD7OimKos0asD1m3/xHGLCHwfaSywUAAEBtXG/3x/V2f7ASwIIvlmA9ImAVAAQAAIAAziLrf3++GyoAWNFYApusfg606PGPjJ1tK0ABLIfX0zUr4cbJDiAAARKIzrz3ynsIA3AFCDqJo+T2p+tApm0AAjh9uS0i2Pbu+R4EkDlXcHICeHU+Jafbk9iedu6tibcCgAwggFMF2+g928u2dyQQGZwQAQRwqoBTs8mS4IsiIYgAApAph0U6oIoKULiOoDwWIYCeElL0JiipgQzHVCBCLxtGS5jVCcE6/975torSU5EEsspvCvOfZcPsvoUVVcHs+GtR7O/ZonpEhnq3yCr0BigSQO/pb+lzsPifQsJ4lg0z4q9Vkyy9EjyLgDLnnk2AnuNnXBFGTl/vcnavD7bMHvVIJlx5fIWcTfXxM9qmFfxvG5GvOH6NZGmmAqmSMPP0d6s6iIy/rfdOO9vxrSUtj8DzduTscqD1GwKvU3NkHUb2qBLxRsVfWEBkbXrV8TMz4v9JuMz9z95za4nXIxEbsf6tkszNLkGqlEAjG4Aik22fEmXRvRYWae5ZifGMv025vKVkR6XPbGfa1Ss7R078o7+NJvlZpUklv2sEfq0vEpUajjIJWOkLRw9lErXeWxVHVyAfAn9tAs5WdBlrLdMlpfaopdLjmtFEpHTdUX/kdMbpnzlHucc1lILt7IEPAa+VG+JJsCIkFB0ASvNWtKfia1WA//lj3tgLACD4AQAEPgAAPOMPTDW3B4HXjdoAAAAASUVORK5CYII=';
swTex.magFilter = THREE.NearestFilter; swTex.minFilter = THREE.NearestFilter; swTex.generateMipmaps = false;
const swMat = new THREE.MeshBasicMaterial({ map:swTex, transparent:true, alphaTest:.5, fog:false, toneMapped:false, side:THREE.DoubleSide });
const trailMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{ color:{ value:new THREE.Color(0xfffaf4) } },
  vertexShader:'attribute float alpha; varying float vA; void main(){ vA = alpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:'uniform vec3 color; varying float vA; void main(){ gl_FragColor = vec4(color, vA); }'
});
function makeSwallow(){
  const geo = new THREE.PlaneGeometry(SW_ASPECT, 1);
  const mesh = new THREE.Mesh(geo, swMat); mesh.visible = false; mesh.renderOrder = 2; scene.add(mesh);
  const tp = new Float32Array(TR*2*3), ta = new Float32Array(TR*2), tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(tp,3)); tg.setAttribute('alpha', new THREE.BufferAttribute(ta,1));
  const idx = []; for (let i=0;i<TR-1;i++){ const q=i*2; idx.push(q,q+1,q+2, q+1,q+3,q+2); }
  tg.setIndex(idx); tg.setDrawRange(0,0);
  const trail = new THREE.Mesh(tg, trailMat); trail.frustumCulled = false; trail.renderOrder = 1; scene.add(trail);
  return { mesh, geo, tg, tp, ta, hist:[], active:false, t:0, frame:0, shown:-1, ft:0, du:0, dv:0 };
}
const swallows = Array.from({ length:4 }, makeSwallow);
let swWait = 1.2, swFlight = null;
const bez = (a,b,c,d,t) => { const m=1-t; return m*m*m*a + 3*m*m*t*b + 3*m*t*t*c + t*t*t*d; };
const swAt = (P, k, b) => [bez(P[0][0],P[1][0],P[2][0],P[3][0],k)+b.du, bez(P[0][1],P[1][1],P[2][1],P[3][1],k)+b.dv];
function launch(){
  const n = 3 + (Math.random() < .5 ? 1 : 0);
  const y0 = .55 + Math.random()*.3, y3 = .1 + Math.random()*.4, deep = -.5 - Math.random()*.35;
  swFlight = { P:[[-1.25, y0], [-.4, y0+.2], [-.1, deep], [1.3, y3]], dur: 5 + Math.random()*1.5 };
  swallows.forEach((b,i) => {
    b.active = i < n; b.t = -i*.22; b.hist.length = 0; b.mesh.visible = false; b.frame = (i*3) % SW_FRAMES;
    b.du = -i*.035; b.dv = (i%2 ? 1 : -1) * Math.ceil(i/2) * .07;
  });
}
const sUp = new V3(), sTmp = new V3(), sA = new V3(), sB = new V3(), sT = new V3(), sN = new V3();
const swPoint = (u, v, D, hw, hh, pos, out) => out.copy(pos).addScaledVector(fwd, D).addScaledVector(side, u*hw).addScaledVector(sUp, v*hh);
function swallowStep(dt, pos, dist){
  if (weather !== 'sun'){
    swallows.forEach(b => { b.mesh.visible = false; b.tg.setDrawRange(0,0); b.hist.length = 0; b.active = false; });
    swFlight = null; swWait = 1.2; return;
  }
  const run = !paused;
  sUp.crossVectors(side, fwd).normalize();
  const D = dist + 14, hh = D*tanH, hw = hh*camera.aspect;
  const ppu = sceneEl.clientHeight / (2*hh);
  if (!swFlight){ if (run) swWait -= dt; if (swWait > 0 || !run) return; launch(); }
  const size = 58 / ppu;                     // about 58 css px tall on screen
  let alive = false;
  for (const b of swallows){
    if (!b.active) continue;
    if (run){ b.t += dt; for (const h of b.hist) h.age += dt; }
    while (b.hist.length && b.hist[0].age > TRAIL_LIFE) b.hist.shift();
    const k = b.t / swFlight.dur;
    if (k < 0){ alive = true; continue; }
    if (k <= 1){
      alive = true;
      const [u, v] = swAt(swFlight.P, k, b), [u2, v2] = swAt(swFlight.P, Math.min(1, k+.01), b);
      const ang = Math.atan2((v2-v)*hh, (u2-u)*hw);
      swPoint(u, v, D, hw, hh, pos, b.mesh.position);
      b.mesh.quaternion.copy(camera.quaternion); b.mesh.rotateZ(ang);
      b.mesh.scale.setScalar(size); b.mesh.visible = true;
      if (run){ b.ft += dt; if (b.ft > .07){ b.ft = 0; b.frame = (b.frame + 1) % SW_FRAMES; } }
      const f = ang < -.55 ? 0 : b.frame;     // wings tucked in the steep part of the dive
      if (f !== b.shown){ const uv = b.geo.attributes.uv; uv.array.set([f/8,1, (f+1)/8,1, f/8,0, (f+1)/8,0]); uv.needsUpdate = true; b.shown = f; }
      if (run){
        b.hist.push({ u: u - Math.cos(ang)*size*.42/hw, v: v - Math.sin(ang)*size*.42/hh, age:0 });
        if (b.hist.length > TR) b.hist.shift();
      }
    } else { b.mesh.visible = false; if (b.hist.length) alive = true; }
    // rebuild the contrail ribbon
    const n = b.hist.length;
    for (let i=0;i<n;i++){
      const h = b.hist[i];
      swPoint(h.u, h.v, D, hw, hh, pos, sTmp);
      const pa = b.hist[Math.max(0,i-1)], pb = b.hist[Math.min(n-1,i+1)];
      swPoint(pa.u, pa.v, D, hw, hh, pos, sA); swPoint(pb.u, pb.v, D, hw, hh, pos, sB);
      sT.subVectors(sB, sA); if (sT.lengthSq() < 1e-8) sT.copy(side);
      sN.crossVectors(sT, fwd).normalize();
      const age = h.age / TRAIL_LIFE, w = size*(.035 + .05*age);
      const head = Math.min(1, (n-1-i)/5 + .25);
      const al = .72 * Math.pow(1-age, 1.4) * head;
      b.tp.set([sTmp.x+sN.x*w, sTmp.y+sN.y*w, sTmp.z+sN.z*w, sTmp.x-sN.x*w, sTmp.y-sN.y*w, sTmp.z-sN.z*w], i*6);
      b.ta[i*2] = al; b.ta[i*2+1] = al;
    }
    b.tg.attributes.position.needsUpdate = true; b.tg.attributes.alpha.needsUpdate = true;
    b.tg.setDrawRange(0, Math.max(0, (n-1)*6));
  }
  if (!alive){ swFlight = null; swallows.forEach(b => { b.active = false; b.tg.setDrawRange(0,0); }); swWait = 6 + Math.random()*6; }
}

const fwd = new V3(), center = new V3(), side = new V3();
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if (anim){
    const k = Math.min(1, (now-anim.t0)/anim.dur), e = ease(k);
    const cam = lerpC(anim.from.cam, anim.to.cam, e); cam.r += Math.sin(Math.PI*k)*anim.bump;
    cur = { cam, tgt:lerpC(anim.from.tgt, anim.to.tgt, e) };
    if (k>=1){ cur = anim.to; anim = null; }
  }
  const pos = fromCyl(cur.cam), tgt = fromCyl(cur.tgt);
  camera.position.copy(pos); camera.lookAt(tgt);
  fwd.subVectors(tgt, pos).normalize();
  side.crossVectors(fwd, camera.up).normalize();
  // the sun always sits low, left of the tower, just above the skyline
  const sh = 560*tanH, sw = sh*camera.aspect;
  sunSprite.position.copy(pos).addScaledVector(fwd, 560).addScaledVector(side, -.44*sw).addScaledVector(camera.up, .13*sh);
  sunGlow.position.copy(sunSprite.position);
  sunSprite.scale.setScalar(sh*.42); sunGlow.scale.setScalar(sh*1.9);
  // low warm key light raking across the wall from the sun's side
  sunL.target.position.copy(tgt);
  sunL.position.copy(tgt).addScaledVector(side, -70).addScaledVector(fwd, -55).add(new V3(0, 26, 0));
  if (!paused){ center.copy(pos).addScaledVector(fwd, 18); updateWeather(dt, now/1000, center); }
  swallowStep(dt, pos, pos.distanceTo(tgt));
  renderer.render(scene, camera);
  // Only reveal the scene after all signs exist and the complete first frame renders.
  if (sceneLoading) finishSceneLoading();
  updatePosterLinks();
  requestAnimationFrame(frame);
}

const fontsReady = Promise.all([
  '100px "DM Serif Display"', '400 40px "IBM Plex Sans"', '600 40px "IBM Plex Sans"', '500 30px "IBM Plex Mono"'
].map(f => document.fonts ? document.fonts.load(f) : Promise.resolve()));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).catch(()=>{}).then(() => {
  buildSigns();
  setWeather(weather);
  window.__setView = setView; window.__setWeather = setWeather;
  resize(); setView(curSec, curStop, true);
  requestAnimationFrame(frame);
}).catch(showSceneFallback);
})();
</script>
